<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="acento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE34D"/>
      <stop offset="60%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#E8B800"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF7"/>

  <g transform="translate(120, 155)" filter="url(#sombra)">
    <rect x="-30" y="-30" width="260" height="380" rx="32" fill="#FFFFFF" stroke="rgba(13,13,15,0.08)"/>

    <circle cx="50" cy="50" r="34" fill="url(#acento)"/>
    <circle cx="50" cy="160" r="34" fill="rgba(13,13,15,0.04)" stroke="rgba(13,13,15,0.12)" stroke-width="2"/>
    <circle cx="50" cy="270" r="34" fill="url(#acento)"/>
    <circle cx="170" cy="50" r="34" fill="url(#acento)"/>
    <circle cx="170" cy="160" r="34" fill="rgba(13,13,15,0.04)" stroke="rgba(13,13,15,0.12)" stroke-width="2"/>
    <circle cx="170" cy="270" r="34" fill="url(#acento)"/>
  </g>

  <g transform="translate(440, 210)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="700" fill="#0D0D0F" letter-spacing="-5">Aprende</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="700" fill="url(#acento)" letter-spacing="-5">braille</text>

    <rect x="0" y="180" width="70" height="4" fill="url(#acento)" rx="2"/>

    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="500" fill="#535357">Manual interactivo</text>
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#8C8C92">Alfabeto · Escritura · Dictado · Traductor</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#8C8C92" letter-spacing="2">DOTZY.NETLIFY.APP</text>
